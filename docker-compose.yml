# Development environment. Override defaults via a .env file next to this one (see DOCKER.md).
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor          # named volume: much faster than a Windows bind mount
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-innovexify}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      VITE_DEV_SERVER_URL: http://localhost:5173
      # www-data has no writable home; tinker/psysh and composer need somewhere to write
      XDG_CONFIG_HOME: /tmp/xdg/config
      XDG_DATA_HOME: /tmp/xdg/data
      XDG_RUNTIME_DIR: /tmp/xdg/run
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      # public/storage is a symlink to this absolute path, so nginx needs it at the same location
      - ./storage/app/public:/var/www/html/storage/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-innovexify}
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  node:
    image: node:22-bookworm-slim
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    environment:
      VITE_HOST: 0.0.0.0
      VITE_HMR_HOST: localhost
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    command: sh -c "npm install --no-package-lock --no-audit --no-fund && npm run dev"
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  vendor:
  node_modules:
